    <div class="row">
      <div>
        <label for="focus">Focus</label>
        <select id="focus"><option value="full">Full: outfit + hair + body + framing</option><option value="outfit">Outfit only</option></select>
      </div>
    </div>
    <div>
      <label for="notes">Extra instructions (optional)</label>
      <textarea id="notes" placeholder="e.g. 'treat as anime style', 'ignore the background', 'be specific about fabric'"></textarea>
    </div>
    <div class="row">
      <button class="primary" id="run" disabled>Interpret outfit</button>
      <button id="openOptions" class="small">Settings</button>
    </div>
    <div class="status" id="status">Waiting for an image.</div>
    <p class="tiny" id="modelInfo"></p>
